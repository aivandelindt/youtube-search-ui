services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        NODE_IMAGE: node:22.12-bookworm-slim
        YTDLP_VERSION: "2024.12.13"
    image: youtube-search-ui-api:0.1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NODE_IMAGE: node:22.12-bookworm-slim
        NGINX_IMAGE: nginx:1.26.3-alpine
    image: youtube-search-ui-web:0.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
