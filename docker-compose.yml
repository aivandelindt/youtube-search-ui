services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        NODE_IMAGE: node:22.12-bookworm-slim
        YTDLP_VERSION: "2024.12.13"
    image: youtube-search-ui-api:0.1.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Next listens on localhost by default; healthcheck uses 127.0.0.1 — bind all interfaces.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - app-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  worker:
    image: youtube-search-ui-api:0.1.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["node", "worker.cjs"]
    working_dir: /app
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    volumes:
      - app-data:/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NODE_IMAGE: node:22.12-bookworm-slim
        NGINX_IMAGE: nginx:1.26.3-alpine
    image: youtube-search-ui-web:0.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:
