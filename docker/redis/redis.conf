# Redis for docker-compose (dev / small deployments).
# See README: vm.overcommit_memory is a *host* Linux sysctl; Docker Desktop often cannot apply it in-container.

bind 0.0.0.0
# Compose bridge only in typical dev; use requirepass + protected-mode yes for internet-facing Redis.
protected-mode no

dir /data
appendonly yes
appendfilename "appendonly.aof"

maxmemory 256mb
maxmemory-policy allkeys-lru
